name: Deploy Lyrica site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site

          cp -R landing-prototype/. _site/
          cp -R final-src-branding _site/final-src-branding
          cp -R snap _site/snap
          find _site -maxdepth 1 -name "*.html" -print0 | while IFS= read -r -d '' file; do
            perl -0pi -e 's!\.\./final-src-branding/!./final-src-branding/!g; s!\.\./snap/!./snap/!g' "$file"
          done

          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
